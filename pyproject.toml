[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semverconv"
version = "0.1.0"
description = "Convert Semantic Versioning strings to PEP 440 version strings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nhall494" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
